version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      FLASK_SECRET_KEY: ${SECRET_KEY:?Configure privately}
      DB_PATH: "/app/database/plates.db"
      RTSP_URL: "0"
    volumes:
      - ./models:/app/models
      - ./database:/app/database
      - ./logs:/app/logs
    restart: unless-stoppeds