services:
  app:
    build: .
    # Bind to loopback; use a configured HTTPS proxy for remote access.
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      DB_PATH: /app/database/plates.db
    volumes:
      - ./models:/app/models:ro
      - plate-data:/app/database
    restart: unless-stopped

volumes:
  plate-data:
